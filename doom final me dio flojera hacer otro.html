<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doom Horde - Operación Final</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&display=swap');

        body { margin: 0; overflow: hidden; background-color: #000; font-family: 'Orbitron', sans-serif; }
        canvas { display: block; image-rendering: pixelated; width: 100vw; height: 100vh; cursor: crosshair; }
        
        .overlay-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 100; text-align: center;
            background: radial-gradient(circle, #400 0%, #000 100%);
        }

        .title { 
            font-size: clamp(3rem, 10vw, 6rem); 
            color: #ff0000; 
            text-shadow: 0 0 20px #f00, 5px 5px #000; 
            font-weight: 900; 
            letter-spacing: 5px;
            animation: glitch 1s infinite alternate;
        }

        @keyframes glitch {
            0% { transform: translate(0) }
            20% { transform: translate(-2px, 2px) }
            40% { transform: translate(-2px, -2px) }
            60% { transform: translate(2px, 2px) }
            80% { transform: translate(2px, -2px) }
            100% { transform: translate(0) }
        }

        .btn { 
            padding: 15px 50px; 
            background: #900; 
            color: white; 
            border: 2px solid #f00; 
            font-size: 1.2rem; 
            font-weight: bold;
            cursor: pointer; 
            transition: all 0.2s; 
            text-transform: uppercase;
        }
        .btn:hover { background: #f00; transform: scale(1.05); box-shadow: 0 0 20px #f00; }

        #ui-overlay {
            position: absolute;
            bottom: 0; left: 0; width: 100%;
            background: linear-gradient(to top, rgba(0,0,0,0.9), transparent);
            display: none; flex-direction: column;
            color: #ff3333; pointer-events: none; z-index: 10;
            padding: 20px;
        }

        .stat-box {
            text-align: center; background: rgba(30,0,0,0.9);
            padding: 8px 15px; border: 1px solid #a00; min-width: 130px;
            clip-path: polygon(10% 0, 100% 0, 90% 100%, 0 100%);
        }

        #minimap-container {
            position: absolute; top: 20px; left: 20px; width: 180px; height: 180px;
            background: rgba(0, 10, 0, 0.9); border: 2px solid #0f0; display: none; z-index: 50;
            border-radius: 50%; overflow: hidden; box-shadow: 0 0 20px rgba(0, 255, 0, 0.4);
        }

        #pickup-notification {
            position: absolute; top: 20%; left: 50%; transform: translate(-50%, -50%);
            color: #fff; font-size: 1.5rem; font-weight: 900; text-shadow: 2px 2px 5px #000;
            pointer-events: none; z-index: 200; opacity: 0; transition: all 0.3s;
        }

        #crosshair {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: #0f0; font-size: 24px; pointer-events: none; display: none; opacity: 0.8;
        }

        .hp-bar-bg { width: 100%; height: 6px; background: #300; margin-top: 4px; border-radius: 3px; overflow: hidden; }
        .hp-bar-fill { height: 100%; transition: width 0.3s ease-out; }
        
        .indicator {
            position: absolute; top: 20px; right: 20px; font-weight: 900;
            display: none; text-shadow: 0 0 10px currentColor; font-size: 0.8rem; animation: pulse 1s infinite;
        }
        @keyframes pulse { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }
        
        .blood-vignette {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            box-shadow: inset 0 0 0px rgba(255, 0, 0, 0);
            pointer-events: none; z-index: 5; transition: box-shadow 0.2s;
        }
    </style>
</head>
<body>

    <div class="blood-vignette" id="vignette"></div>
    <div id="pickup-notification"></div>
    
    <div id="nightmare-indicator" class="indicator text-red-600">MODO PESADILLA: ACTIVO - EL MAPA HA MUTADO</div>
    <div id="test-indicator" class="indicator text-yellow-400" style="top: 45px;">MODO TEST: ACTIVO (T: Alternar | E: Spawn)</div>

    <div id="start-screen" class="overlay-screen">
        <h1 class="title">DOOM HORDE</h1>
        <div class="mt-6">
            <p class="text-red-500 font-bold mb-4 tracking-widest text-sm">SQUAD INDEPENDIENTE</p>
            <button class="btn" onclick="startGame()">INICIAR OPERACIÓN</button>
        </div>
    </div>

    <div id="death-screen" class="overlay-screen" style="display: none; background: #000;">
        <h1 class="title" style="font-size: 4rem;">UNIDAD CAÍDA</h1>
        <p class="text-white mt-4 opacity-60">TU ESCUADRÓN FUE ELIMINADO.</p>
        <button class="btn mt-8" onclick="resetGame()">REINTENTAR</button>
    </div>

    <canvas id="gameCanvas"></canvas>
    
    <div id="minimap-container">
        <canvas id="minimap-canvas" style="width: 100%; height: 100%;"></canvas>
    </div>

    <div id="crosshair">＋</div>
    <div id="respawn-msg" style="position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%); color: #f00; font-size: 2rem; display: none; z-index: 60; font-weight: 900; text-shadow: 2px 2px #000;">REANIMANDO...</div>
    
    <div id="ui-overlay">
        <div id="squad-container" class="flex justify-center gap-4 mb-4 flex-wrap"></div>
        <div class="main-stats flex justify-around items-center border-t border-red-900/40 pt-4 pb-2 bg-black/60">
            <div class="stat-box">SALUD: <span id="health">150</span></div>
            <div class="stat-box">VIDAS: <span id="lives">3</span></div>
            <div class="stat-box">BALAS: <span id="ammo">60</span></div>
            <div class="stat-box">BAJAS: <span id="kills">0</span></div>
        </div>
    </div>

<script>
/** AUDIO */
class AudioManager {
    constructor() { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); }
    playShoot(freq = 150) {
        try {
            const osc = this.ctx.createOscillator(); const gain = this.ctx.createGain();
            osc.type = 'square'; osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(30, this.ctx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.05, this.ctx.currentTime);
            gain.gain.linearRampToValueAtTime(0, this.ctx.currentTime + 0.1);
            osc.connect(gain); gain.connect(this.ctx.destination);
            osc.start(); osc.stop(this.ctx.currentTime + 0.1);
        } catch(e) {}
    }
    playPickup() {
        try {
            const osc = this.ctx.createOscillator(); const gain = this.ctx.createGain();
            osc.type = 'sine'; osc.frequency.setValueAtTime(400, this.ctx.currentTime);
            osc.frequency.linearRampToValueAtTime(800, this.ctx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.1, this.ctx.currentTime);
            osc.connect(gain); gain.connect(this.ctx.destination);
            osc.start(); osc.stop(this.ctx.currentTime + 0.1);
        } catch(e) {}
    }
}

let audio;
const textures = {
    wall: null, wallNightmare: null,
    generate() {
        const c = document.createElement('canvas'); c.width = 64; c.height = 64;
        const x = c.getContext('2d'); x.fillStyle = '#111'; x.fillRect(0,0,64,64);
        x.strokeStyle = '#333'; x.lineWidth = 1; for(let i=0; i<64; i+=16) x.strokeRect(0, i, 64, 16);
        this.wall = c;
        const c2 = document.createElement('canvas'); c2.width = 64; c2.height = 64;
        const x2 = c2.getContext('2d'); x2.fillStyle = '#200'; x2.fillRect(0,0,64,64);
        x2.strokeStyle = '#500'; x2.lineWidth = 2; for(let i=0; i<64; i+=16) x2.strokeRect(0, i, 64, 16);
        this.wallNightmare = c2;
    }
};

/** DATA */
const mapSize = 32;
let map = [], gameState = 'START';
let player, entities = [], bullets = [], pickups = [];
let keys = {}, lastEnemySpawn = 0, lastPickupSpawn = 0, nightmareMode = false, testMode = false;
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const mCanvas = document.getElementById('minimap-canvas');
const mCtx = mCanvas.getContext('2d');

function initMap() {
    map = new Array(mapSize * mapSize).fill(0);
    for(let i=0; i<mapSize; i++) {
        map[i] = map[mapSize*(mapSize-1)+i] = 1;
        map[i*mapSize] = map[i*mapSize+(mapSize-1)] = 1;
    }
    for(let i=0; i<50; i++) {
        let rx = Math.floor(Math.random()*(mapSize-4))+2;
        let ry = Math.floor(Math.random()*(mapSize-4))+2;
        if(Math.sqrt((rx-16)**2 + (ry-30)**2) < 5) continue; 
        map[ry*mapSize+rx] = 1;
    }
}

function mutateMapForNightmare() {
    showNotification("¡EL MAPA ESTÁ MUTANDO!");
    for(let i=0; i<80; i++) {
        let rx = Math.floor(Math.random()*(mapSize-4))+2;
        let ry = Math.floor(Math.random()*(mapSize-4))+2;
        if(Math.sqrt((rx-player.x)**2 + (ry-player.y)**2) < 3) continue; 
        map[ry*mapSize+rx] = 1;
    }
}

function initData() {
    initMap();
    player = { x: 16, y: 30, dir: -Math.PI/2, health: 150, maxHealth: 150, ammo: 80, lives: 3, kills: 0, radius: 0.3, isDead: false, respawnTimer: 0 };
    entities = [
        { name: 'SOFÍA', type: 'friend', color: '#00aaff', x: 5, y: 5, health: 150, maxHealth: 150, speed: 0.05, damage: 25, lives: 3, radius: 0.3, isDead: false },
        { name: 'ÁNGEL', type: 'friend', color: '#55ccff', x: 25, y: 5, health: 150, maxHealth: 150, speed: 0.05, damage: 25, lives: 3, radius: 0.3, isDead: false },
        { name: 'BRAYAN', type: 'friend', color: '#3366ff', x: 5, y: 25, health: 150, maxHealth: 150, speed: 0.05, damage: 25, lives: 3, radius: 0.3, isDead: false },
        { name: 'GABRIEL', type: 'friend', color: '#ffaa00', x: 25, y: 25, health: 300, maxHealth: 300, speed: 0.04, damage: 30, lives: 3, radius: 0.4, isDead: false }
    ];
    updateUI();
}

function updateUI() {
    if(!player) return;
    document.getElementById('health').innerText = Math.floor(player.health);
    document.getElementById('lives').innerText = Math.max(0, player.lives);
    document.getElementById('ammo').innerText = testMode ? '∞' : player.ammo;
    document.getElementById('kills').innerText = player.kills;
    const container = document.getElementById('squad-container');
    container.innerHTML = '';
    entities.filter(e => e.type === 'friend').forEach(f => {
        const card = document.createElement('div');
        card.className = `px-3 py-2 bg-black/80 border-b-2 text-[10px] min-w-[110px] ${f.lives <= 0 && f.isDead ? 'opacity-40 grayscale' : ''}`;
        card.style.borderColor = f.isDead ? '#500' : f.color;
        card.innerHTML = `<div class="flex justify-between font-bold mb-1"><span style="color:${f.color}">${f.name}</span><span>V:${f.lives}</span></div>
            <div class="hp-bar-bg"><div class="hp-bar-fill" style="width:${f.isDead?0:(f.health/f.maxHealth)*100}%; background:${f.color}"></div></div>`;
        container.appendChild(card);
    });
    const v = document.getElementById('vignette');
    const intensity = Math.max(nightmareMode ? 0.3 : 0, 1 - (player.health / player.maxHealth));
    v.style.boxShadow = `inset 0 0 ${intensity * 200}px rgba(255,0,0,${intensity})`;
}

function showNotification(text) {
    const el = document.getElementById('pickup-notification');
    el.innerText = text; el.style.opacity = '1';
    setTimeout(() => el.style.opacity = '0', 2000);
}

function spawnEnemy(x, y) {
    entities.push({ 
        name: nightmareMode ? 'ARCHVIL' : 'DEMONIO', type: 'enemy', color: nightmareMode ? '#f0f' : '#f33', x: x, y: y, 
        health: nightmareMode?250:100, maxHealth: nightmareMode?250:100, speed: nightmareMode?0.08:0.06, damage: nightmareMode?35:20, radius: 0.3, isDead: false 
    });
}

function firePlayer() {
    if(gameState === 'PLAYING' && !player.isDead && (player.ammo > 0 || testMode)) {
        let damage = testMode ? 500 : (nightmareMode ? 60 : 45);
        bullets.push({ x: player.x, y: player.y, vx: Math.cos(player.dir)*0.35, vy: Math.sin(player.dir)*0.35, owner: 'player', color: testMode ? '#ff0' : '#fff', damage: damage });
        if(!testMode) player.ammo--;
        audio.playShoot(testMode ? 300 : 180); updateUI();
    }
}

/** LOOP */
function update() {
    if(gameState !== 'PLAYING') return;
    if(testMode) { player.health = 150; player.ammo = 999; }
    if(player.isDead) {
        player.respawnTimer -= 16;
        if(player.respawnTimer <= 0) {
            if(player.lives >= 0) { player.isDead = false; player.health = 150; document.getElementById('respawn-msg').style.display = 'none'; updateUI(); }
            else { triggerGameOver(); }
        }
    } else {
        let ms = 0.085;
        let nx = player.x, ny = player.y;
        if(keys['KeyW']) { nx += Math.cos(player.dir)*ms; ny += Math.sin(player.dir)*ms; }
        if(keys['KeyS']) { nx -= Math.cos(player.dir)*ms; ny -= Math.sin(player.dir)*ms; }
        if(keys['KeyA']) { nx += Math.cos(player.dir-1.57)*ms; ny += Math.sin(player.dir-1.57)*ms; }
        if(keys['KeyD']) { nx += Math.cos(player.dir+1.57)*ms; ny += Math.sin(player.dir+1.57)*ms; }
        if(map[Math.floor(player.y)*mapSize+Math.floor(nx+(nx>player.x?0.2:-0.2))] === 0) player.x = nx;
        if(map[Math.floor(ny+(ny>player.y?0.2:-0.2))*mapSize+Math.floor(player.x)] === 0) player.y = ny;
        for(let i=pickups.length-1; i>=0; i--) {
            let p = pickups[i]; if(Math.sqrt((p.x-player.x)**2+(p.y-player.y)**2) < 0.5) {
                if(p.type === 'health') { player.health = Math.min(150, player.health+50); showNotification("+50 SALUD"); }
                else { player.ammo += 40; showNotification("+40 BALAS"); }
                audio.playPickup(); pickups.splice(i,1); updateUI();
            }
        }
    }

    entities.forEach(ent => {
        if(ent.isDead) {
            if(ent.type === 'friend' && ent.lives > 0) {
                ent.timer = (ent.timer || 5000) - 16;
                if(ent.timer <= 0) { ent.lives--; ent.isDead = false; ent.health = ent.maxHealth; ent.timer = 5000; updateUI(); }
            } return;
        }
        let target = null, minDist = 25;
        let targs = ent.type === 'friend' ? entities.filter(e => e.type === 'enemy' && !e.isDead) : [player, ...entities.filter(e => e.type === 'friend' && !e.isDead)].filter(t => !t.isDead);
        targs.forEach(t => { let d = Math.sqrt((t.x-ent.x)**2+(t.y-ent.y)**2); if(d < minDist) { minDist = d; target = t; } });
        if(target) {
            let ang = Math.atan2(target.y-ent.y, target.x-ent.x);
            if(minDist > 4) { ent.x += Math.cos(ang)*ent.speed; ent.y += Math.sin(ang)*ent.speed; }
            if(Date.now() - (ent.lastShot || 0) > (ent.type === 'friend' ? 800 : 1500)) {
                bullets.push({ x: ent.x, y: ent.y, vx: Math.cos(ang)*0.2, vy: Math.sin(ang)*0.2, owner: ent.type, color: ent.color, damage: ent.damage });
                ent.lastShot = Date.now();
            }
        }
    });

    for(let i=bullets.length-1; i>=0; i--) {
        let b = bullets[i]; b.x += b.vx; b.y += b.vy;
        if(map[Math.floor(b.y)*mapSize+Math.floor(b.x)] === 1) { bullets.splice(i,1); continue; }
        let hits = b.owner === 'enemy' ? [player, ...entities.filter(e => e.type === 'friend' && !e.isDead)] : entities.filter(e => e.type === 'enemy' && !e.isDead);
        for(let t of hits) {
            if(!t.isDead && Math.sqrt((b.x-t.x)**2+(b.y-t.y)**2) < 0.4) {
                if(t === player && testMode) { bullets.splice(i,1); break; }
                t.health -= b.damage; if(t.health <= 0) {
                    t.isDead = true; if(t === player) { player.lives--; if(player.lives < 0) triggerGameOver(); else { player.respawnTimer = 3000; document.getElementById('respawn-msg').style.display = 'block'; } }
                    else if(t.type === 'enemy') { player.kills++; if(player.kills === 50 && !nightmareMode) { nightmareMode = true; document.getElementById('nightmare-indicator').style.display = 'block'; mutateMapForNightmare(); } }
                } updateUI(); bullets.splice(i,1); break;
            }
        }
    }
    
    // Generación de Enemigos
    if(Date.now() - lastEnemySpawn > (nightmareMode ? 800 : 2500)) { 
        let ex = Math.random()*mapSize, ey = Math.random()*mapSize; 
        if(map[Math.floor(ey)*mapSize+Math.floor(ex)] === 0) { spawnEnemy(ex, ey); lastEnemySpawn = Date.now(); } 
    }
    
    // AUMENTO DE SPAWN DE SUMINISTROS (De 8s a 3s)
    if(Date.now() - lastPickupSpawn > 3000) { 
        let px = Math.random()*mapSize, py = Math.random()*mapSize; 
        if(map[Math.floor(py)*mapSize+Math.floor(px)] === 0) { 
            pickups.push({ x: px, y: py, type: Math.random() > 0.5 ? 'health' : 'ammo' }); 
            lastPickupSpawn = Date.now(); 
        } 
    }
}

function draw() {
    const w = canvas.width = window.innerWidth, h = canvas.height = window.innerHeight; if(gameState !== 'PLAYING') return;
    
    // Renderizado 3D (Cielo y Suelo)
    ctx.fillStyle = nightmareMode ? '#400' : '#0a0a0a'; ctx.fillRect(0,0,w,h/2);
    ctx.fillStyle = nightmareMode ? '#100' : '#111'; ctx.fillRect(0,h/2,w,h/2);
    
    const fov = 1.0, rays = Math.floor(w/2), zB = new Array(rays);
    for(let i=0; i<rays; i++) {
        let ang = (player.dir - fov/2) + (i/rays)*fov, d = 0, hit = false, hX, hY;
        while(!hit && d < 20) { d += 0.1; hX = player.x + Math.cos(ang)*d; hY = player.y + Math.sin(ang)*d; if(map[Math.floor(hY)*mapSize+Math.floor(hX)] === 1) hit = true; }
        zB[i] = d; let lH = h / (d * Math.cos(ang-player.dir));
        ctx.drawImage(nightmareMode?textures.wallNightmare:textures.wall, (hX%1+hY%1)%1*64, 0, 1, 64, i*(w/rays), (h-lH)/2, (w/rays)+1, lH);
        ctx.fillStyle = `rgba(${nightmareMode?20:0},0,0,${d/15})`; ctx.fillRect(i*(w/rays), (h-lH)/2, (w/rays)+1, lH);
    }

    // Sprites 3D
    const sprites = [...entities.filter(e => !e.isDead), ...bullets, ...pickups].map(s => { 
        let dx = s.x-player.x, dy = s.y-player.y; 
        return {...s, d: Math.sqrt(dx*dx+dy*dy), a: Math.atan2(dy,dx)}; 
    }).sort((a,b) => b.d-a.d);

    sprites.forEach(s => {
        let rel = s.a - player.dir; while(rel < -Math.PI) rel += Math.PI*2; while(rel > Math.PI) rel -= Math.PI*2;
        if(Math.abs(rel) < fov) {
            let sx = (0.5 * (rel / (fov/2)) + 0.5) * w, sz = h / s.d, zi = Math.floor((sx/w)*rays);
            if(zi >= 0 && zi < rays && zB[zi] > s.d) {
                ctx.fillStyle = s.color || (s.type === 'health' ? '#0f0' : '#ff0');
                
                if(s.vx) { // Balas
                    ctx.beginPath(); ctx.arc(sx, h/2+sz/4, sz/15, 0, 7); ctx.fill(); 
                }
                else if(s.type) { // Pickups (Botiquines/Munición)
                    ctx.fillRect(sx-sz/6, h/2+sz/4, sz/3, sz/3); 
                }
                else { 
                    // ALIADOS Y ENEMIGOS MÁS ALTOS (ESCALA AUMENTADA)
                    const baseScale = 3.5;  // Escala base
                    const heightScale = 5.0; // Multiplicador de altura para que sean gigantes
                    
                    if(s.type === 'enemy') {
                        // Enemigo imponente y alargado
                        ctx.beginPath();
                        // Cabeza muy arriba
                        ctx.moveTo(sx, h/2 - (sz/1.2) * heightScale); 
                        // Hombros anchos
                        ctx.lineTo(sx + (sz/2.2) * baseScale, h/2 + (sz/4) * baseScale);
                        // Pies en el suelo
                        ctx.lineTo(sx, h/2 + (sz/2) * baseScale); 
                        // Hombro izquierdo
                        ctx.lineTo(sx - (sz/2.2) * baseScale, h/2 + (sz/4) * baseScale);
                        ctx.closePath(); ctx.fill();
                        
                        // Ojo brillante central más alto
                        ctx.fillStyle = '#fff';
                        ctx.beginPath(); ctx.arc(sx, h/2 - (sz/3) * heightScale, (sz/8) * baseScale, 0, 7); ctx.fill();
                    } else {
                        // Aliado robusto y alto
                        // Cuerpo principal estirado hacia arriba
                        ctx.fillRect(sx - (sz/3) * baseScale, h/2 - (sz/1.5) * heightScale, (sz/1.5) * baseScale, (sz) * heightScale);
                        // Cabeza
                        ctx.beginPath(); ctx.arc(sx, h/2 - (sz/1.5) * heightScale, (sz/3.2) * baseScale, 0, 7); ctx.fill();
                        
                        // Etiqueta de nombre mucho más alta
                        ctx.fillStyle = '#fff';
                        ctx.font = `bold ${Math.floor((sz/4) * baseScale)}px Orbitron`;
                        ctx.textAlign = 'center';
                        ctx.fillText(s.name, sx, h/2 - (sz/1.2) * heightScale - 20);
                    }
                }
            }
        }
    });

    // MINIMAPA DETALLADO
    mCanvas.width = 180; mCanvas.height = 180;
    mCtx.save();
    mCtx.translate(90,90);
    mCtx.rotate(-player.dir-Math.PI/2);
    
    // Dibujar Muros
    mCtx.fillStyle = nightmareMode ? '#411' : '#141';
    for(let y=0; y<mapSize; y++) {
        for(let x=0; x<mapSize; x++) {
            if(map[y*mapSize+x]) mCtx.fillRect((x-player.x)*6,(y-player.y)*6,5,5);
        }
    }

    // Dibujar Pickups en el minimapa
    pickups.forEach(p => {
        mCtx.fillStyle = p.type === 'health' ? '#0f0' : '#ff0';
        mCtx.beginPath(); mCtx.arc((p.x-player.x)*6 + 2.5, (p.y-player.y)*6 + 2.5, 2.5, 0, 7); mCtx.fill();
    });

    // Dibujar Entidades en el minimapa
    entities.filter(e => !e.isDead).forEach(e => {
        mCtx.fillStyle = e.type === 'enemy' ? '#f00' : '#0cf';
        if(e.type === 'enemy' && Math.floor(Date.now()/200)%2 === 0) mCtx.fillStyle = '#600';
        mCtx.beginPath(); mCtx.arc((e.x-player.x)*6 + 2.5, (e.y-player.y)*6 + 2.5, 3, 0, 7); mCtx.fill();
    });

    mCtx.restore();
    
    // Jugador (Centro del radar)
    mCtx.fillStyle = '#fff';
    mCtx.shadowBlur = 10; mCtx.shadowColor = "#fff";
    mCtx.beginPath(); mCtx.arc(90,90,4,0,7); mCtx.fill();
    mCtx.shadowBlur = 0;
}

/** INPUT */
window.onkeydown = e => { 
    keys[e.code] = true; 
    if(e.code === 'Space') firePlayer();
    if(e.code === 'KeyT') { testMode = !testMode; document.getElementById('test-indicator').style.display = testMode ? 'block' : 'none'; updateUI(); }
    if(e.code === 'KeyE' && testMode) { let sx = player.x + Math.cos(player.dir)*2, sy = player.y + Math.sin(player.dir)*2; spawnEnemy(sx, sy); }
};
window.onkeyup = e => keys[e.code] = false;
window.onmousemove = e => { if(document.pointerLockElement) player.dir += e.movementX * 0.003; };
window.onmousedown = () => firePlayer();

function startGame() { 
    audio = new AudioManager(); textures.generate(); initData(); gameState = 'PLAYING'; 
    document.getElementById('start-screen').style.display = 'none'; document.getElementById('ui-overlay').style.display = 'flex';
    document.getElementById('minimap-container').style.display = 'block'; document.getElementById('crosshair').style.display = 'block';
    canvas.requestPointerLock(); requestAnimationFrame(function loop() { update(); draw(); requestAnimationFrame(loop); });
}
function triggerGameOver() { gameState = 'GAMEOVER'; document.getElementById('death-screen').style.display = 'flex'; document.exitPointerLock(); }
function resetGame() { location.reload(); }
</script>
